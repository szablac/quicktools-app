<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickTools.hu – Mikroeszköz-gyűjtemény</title>
<link rel="canonical" href="https://quicktools.qwer.hu/">
<link rel="alternate" hreflang="hu" href="https://quicktools.qwer.hu/">
<link rel="alternate" hreflang="en" href="https://quicktools.qwer.hu/en/">
<link rel="alternate" hreflang="x-default" href="https://quicktools.qwer.hu/">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2290062414680227" crossorigin="anonymous"></script>
<meta name="description" content="QuickTools.hu: folyamatosan bővülő webes mikroeszköz-gyűjtemény kisvállalkozóknak, fejlesztőknek és kreatívoknak.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #f9f8f5; --card: #ffffff; --card-muted: #f2f0eb; --border: #ece9e2;
    --text: #2b2e2c; --muted: #6b6f6a; --accent: #5b7f6f; --accent-dark: #46655a; --accent-tint: #e9efe9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-dark); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 32px; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 32px 0; }
  .logo { font-weight: 700; font-size: 19px; color: var(--text); }
  .navlinks { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .navlinks a { color: var(--muted); padding: 8px 16px; border-radius: 100px; }
  .navlinks a.active { color: var(--text); font-weight: 600; background: var(--card-muted); }
  header.hero { padding: 40px 0 48px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 100px; background: var(--accent-tint); font-size: 13px; font-weight: 600; color: var(--accent-dark); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  h1 { margin: 0; font-size: 40px; font-weight: 700; line-height: 1.2; max-width: 620px; }
  .sub { margin: 0; font-size: 16px; line-height: 1.7; color: var(--muted); max-width: 480px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; padding-bottom: 56px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { border-radius: 24px; padding: 28px; background: var(--card); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px; transition: box-shadow .2s, transform .2s; }
  .card.live:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(80,100,90,0.12); }
  .card.placeholder { background: var(--card-muted); }
  .icon { width: 48px; height: 48px; border-radius: 16px; background: var(--accent-tint); display: flex; align-items: center; justify-content: center; }
  .icon.muted { background: #e6e3db; }
  .card-title { font-size: 17px; font-weight: 700; }
  .card-title.muted { color: var(--muted); }
  .card-desc { font-size: 13px; line-height: 1.6; color: var(--muted); }
  .card-desc.muted { color: #7a776f; }
  .card-cta { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: auto; }
  footer { padding: 24px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <div class="wrap">
    <nav>
      <div class="logo">QuickTools.hu</div>
      <div class="navlinks">
        <a href="/" class="active">Eszközök</a>
        <a href="/en/">EN</a>
      </div>
    </nav>

    <header class="hero">
      <div class="badge"><span class="dot"></span> Mikroeszköz-gyűjtemény</div>
      <h1>Kis eszközök a napi feladatokhoz, amiket örömmel használsz</h1>
      <p class="sub">Regisztráció nélkül, azonnal induló webes segédeszközök kisvállalkozóknak, fejlesztőknek és kreatívoknak.</p>
    </header>

    <div class="grid" id="tools-grid">
      <div class="card placeholder"><div class="icon muted"></div><div class="card-title muted">Betöltés…</div></div>
    </div>

    <footer>
      <div><a href="/adatvedelem.html">Adatvédelmi tájékoztató</a> &middot; <a href="/sutik.html">Cookie szabályzat</a></div>
    </footer>
  </div>

  <script>
    const ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5b7f6f" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
    const PLUS = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a3a099" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg>';

    // Ugyanaz az ikon minden toolnál, mint amit a tool saját oldalán (hero) használ.
    const TOOL_ICONS = {
      'favicon-generator': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5b7f6f" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
      'json-viewer': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5b7f6f" stroke-width="1.7"><path d="M8 3H6a2 2 0 00-2 2v3a2 2 0 01-2 2 2 2 0 012 2v3a2 2 0 002 2h2M16 3h2a2 2 0 012 2v3a2 2 0 002 2 2 2 0 00-2 2v3a2 2 0 01-2 2h-2"/></svg>',
      'product-photo-optimizer': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5b7f6f" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
      'pdf-page-selector': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5b7f6f" stroke-width="1.7"><path d="M8 3H6a2 2 0 00-2 2v14a2 2 0 002 2h9a2 2 0 002-2v-9l-6-7z"/><path d="M14 3v6h6"/><path d="m9 15 2 2 4-4"/></svg>',
      'color-contrast-checker': '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5b7f6f" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="#5b7f6f" stroke="none"/></svg>',
      'css-gradient-builder': '<svg width="24" height="24" viewBox="0 0 24 24"><defs><linearGradient id="gradCardIcon" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5b7f6f"/><stop offset="100%" stop-color="#a9c2b6"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="5" fill="url(#gradCardIcon)"/></svg>',
    };
    function iconFor(slug) {
      return TOOL_ICONS[slug] || ICON;
    }

    fetch('/api/tools')
      .then((r) => r.json())
      .then((tools) => {
        const grid = document.getElementById('tools-grid');
        const cards = tools.map((t) => `
          <a class="card live" href="/${t.slug}.html" style="cursor:pointer;">
            <div class="icon">${iconFor(t.slug)}</div>
            <div class="card-title">${t.name_hu}</div>
            <div class="card-desc">${t.description_hu || ''}</div>
            <div class="card-cta">Megnyitás &rarr;</div>
          </a>`);
        const placeholdersNeeded = Math.max(0, 3 - tools.length);
        for (let i = 0; i < placeholdersNeeded; i++) {
          cards.push(`
            <div class="card placeholder">
              <div class="icon muted">${PLUS}</div>
              <div class="card-title muted">Következő eszköz</div>
              <div class="card-desc muted">Hamarosan érkezik.</div>
            </div>`);
        }
        grid.innerHTML = cards.join('') || '<div class="card placeholder"><div class="card-title muted">Hamarosan érkeznek az első eszközök.</div></div>';
      })
      .catch(() => {
        document.getElementById('tools-grid').innerHTML = '<div class="card placeholder"><div class="card-title muted">Az eszközlista jelenleg nem elérhető.</div></div>';
      });
  </script>
</body>
</html>
