<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favicon Generator – QuickTools.hu</title>
<meta name="description" content="Upload a logo and generate a full favicon package (ico, png sizes, webmanifest) in one click.">
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6; color: #222; }
  h1 { margin-bottom: 0.25rem; }
  .tagline { color: #555; margin-top: 0; }
  .dropzone { border: 2px dashed #bbb; border-radius: 8px; padding: 2rem; text-align: center; margin: 1.5rem 0; }
  .dropzone.dragover { border-color: #2a5adf; background: #f0f4ff; }
  input[type="file"] { margin-top: 1rem; }
  button { background: #2a5adf; color: #fff; border: none; padding: 0.7rem 1.4rem; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
  button:disabled { background: #99a; cursor: not-allowed; }
  .status { margin-top: 1rem; min-height: 1.5rem; }
  .status.error { color: #c0392b; }
  .status.ok { color: #2a7a2a; }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #ddd; font-size: 0.9rem; color: #777; }
  a { color: #2a5adf; }
  .preview { max-width: 96px; max-height: 96px; margin-top: 1rem; border-radius: 6px; }
</style>
</head>
<body>
  <p><a href="/en/">&larr; QuickTools.hu</a></p>
  <h1>Favicon Generator</h1>
  <p class="tagline">Upload a logo or image and get a downloadable favicon package (ico + png sizes + webmanifest + HTML snippet).</p>

  <form id="favicon-form">
    <div class="dropzone" id="dropzone">
      <p>Drag an image here, or choose one:</p>
      <input type="file" id="image-input" name="image" accept="image/png,image/jpeg,image/webp,image/gif" required>
      <div><img id="preview" class="preview" style="display:none" alt="Preview"></div>
    </div>
    <button type="submit" id="submit-btn">Generate and download package</button>
    <div class="status" id="status"></div>
  </form>

  <footer>
    <a href="/favicon-generator.html">Magyar verzió</a> · <a href="/en/privacy.html">Privacy Policy</a><br><br>
    Contact: <a href="mailto:szablac@gmail.com">szablac@gmail.com</a><br>
    &copy; 2026 QuickTools.hu
  </footer>

  <script>
    const form = document.getElementById('favicon-form');
    const input = document.getElementById('image-input');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');
    const dropzone = document.getElementById('dropzone');

    input.addEventListener('change', () => {
      const file = input.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'inline-block';
      }
    });

    ['dragover', 'dragenter'].forEach(evt =>
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); })
    );
    ['dragleave', 'drop'].forEach(evt =>
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); })
    );
    dropzone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files.length) {
        input.files = e.dataTransfer.files;
        input.dispatchEvent(new Event('change'));
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!input.files[0]) return;

      status.textContent = 'Generating…';
      status.className = 'status';
      submitBtn.disabled = true;

      try {
        const formData = new FormData();
        formData.append('image', input.files[0]);

        const response = await fetch('/api/tools/favicon-generator/generate', {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || 'An unknown error occurred.');
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'favicon-package.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        status.textContent = 'Done! Download started.';
        status.className = 'status ok';
      } catch (err) {
        status.textContent = err.message;
        status.className = 'status error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
